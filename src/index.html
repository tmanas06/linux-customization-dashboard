<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <div id="desktop-bg" aria-hidden="true"></div>

  <header id="topbar">
    <div class="brand"><span class="brand-mark"></span>Dashboard</div>
    <div class="topbar-actions">
      <button id="btn-save" class="btn primary" hidden title="Save and push to your desktop (Ctrl+S)">Save</button>
      <button id="btn-add" class="btn" hidden>Add widget</button>
      <button id="btn-edit" class="btn">Edit dashboard</button>
      <button id="btn-desktop" class="btn" title="Show these widgets on the real desktop">Desktop</button>
      <label class="ctl" title="Theme">
        <span>Theme</span>
        <select id="sel-theme">
          <option value="dark">Dark</option>
          <option value="midnight">Midnight</option>
          <option value="nord">Nord</option>
          <option value="light">Light</option>
        </select>
      </label>
      <label class="ctl" title="Accent color">
        <span>Accent</span>
        <input type="color" id="in-accent" />
      </label>
      <button id="btn-reset" class="btn danger" title="Restore default layout">Reset</button>
    </div>
  </header>

  <div id="preview-hint" role="status"></div>

  <main id="grid" aria-live="polite"></main>

  <aside id="drawer" aria-label="Widget library">
    <div class="drawer-head">
      <h2>Widget library</h2>
      <button id="btn-drawer-close" class="icon-btn" title="Close"></button>
    </div>
    <p class="drawer-hint">Click a widget to add it to your dashboard.</p>
    <div id="drawer-list"></div>
  </aside>

  <div id="modal-overlay" hidden>
    <div id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title">Settings</h2>
        <button id="btn-modal-close" class="icon-btn" title="Close"></button>
      </div>
      <div id="modal-body"></div>
      <div class="modal-foot">
        <button id="btn-modal-cancel" class="btn">Cancel</button>
        <button id="btn-modal-save" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
