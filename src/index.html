<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'" />
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <div id="desktop-bg" aria-hidden="true"></div>

  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.8"/>
            <rect x="14" y="3" width="7" height="7" rx="1.8"/>
            <rect x="3" y="14" width="7" height="7" rx="1.8"/>
            <circle cx="17.5" cy="17.5" r="3.5"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">Dashboard</span>
          <span class="brand-sub">Customize your desktop</span>
        </span>
      </div>

      <nav class="mode-switch" aria-label="Editor mode">
        <button id="btn-edit" class="mode-btn active" type="button" title="Edit Mode (Ctrl+E)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span>Edit Mode</span>
        </button>
        <button id="btn-preview" class="mode-btn" type="button" title="Preview Mode (Ctrl+E)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Preview Mode</span>
        </button>
      </nav>

      <div class="topbar-actions">
        <button id="btn-add" class="btn ghost" type="button" title="Add a widget from the library">
          <span class="btn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
          <span class="label">Add Widget</span>
        </button>
        <button id="btn-save" class="btn primary" type="button" title="Save and push to your desktop (Ctrl+S)">
          <span class="btn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
          <span class="label">Save Layout</span>
        </button>
        <button id="btn-refresh-wallpaper" class="icon-btn gear-btn" type="button" title="Refresh wallpaper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn gear-btn" type="button" title="Settings"></button>
        <span class="win-sep" aria-hidden="true"></span>
        <div class="win-controls" aria-label="Window controls">
          <button id="win-min" class="win-btn" type="button" title="Minimize">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button id="win-max" class="win-btn" type="button" title="Maximize">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>
          </button>
          <button id="win-close" class="win-btn close" type="button" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div id="app-main">
      <main id="canvas">
        <div id="canvas-scroll">
          <div id="preview-hint" role="status"></div>
          <section id="grid" aria-live="polite"></section>
        </div>
      </main>

      <aside id="sidebar" aria-label="Desktop shortcuts">
        <div class="side-title">Shortcuts</div>
        <div id="sidebar-list"></div>
      </aside>
    </div>
  </div>

  <aside id="drawer" aria-label="Widget library">
    <div class="drawer-head">
      <h2>Widget library</h2>
      <button id="btn-drawer-close" class="icon-btn" title="Close"></button>
    </div>
    <p class="drawer-hint">Click a widget to add it to your dashboard.</p>
    <div id="drawer-list"></div>
  </aside>

  <div id="modal-overlay" hidden>
    <div id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title">Settings</h2>
        <button id="btn-modal-close" class="icon-btn" title="Close"></button>
      </div>
      <div id="modal-body"></div>
      <div class="modal-foot">
        <button id="btn-modal-cancel" class="btn ghost">Cancel</button>
        <button id="btn-modal-save" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status">
    <span class="toast-icon"></span>
    <span class="toast-text"></span>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
